<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Hawksearch Search Example</title>
    <link rel="stylesheet" href="/dist/vue-hawksearch.css">
</head>
<body>
<h1>Vue Hawksearch Search Example</h1>
<div id="hawk-vue-app">
    <div class="hawk">
        <div class="hawk__header">
            <search-box></search-box>
        </div>
        <div class="hawk__body">
            <facet-list></facet-list>
            <results></results>
        </div>
    </div>
</div>
<script type="importmap">
    {
        "imports": {
            "vue": "https://cdn.jsdelivr.net/npm/vue@3/dist/vue.esm-browser.prod.js",
            "vuex": "https://cdn.jsdelivr.net/npm/vuex@4/dist/vuex.esm-browser.prod.js"
        }
    }
</script>
<script type="module">
    import HawksearchVue from '/dist/vue-hawksearch.es.js';
    import config from '/examples/app.js';
    window.addEventListener('load', () => {
        var widget = HawksearchVue.createWidget(document.getElementById('hawk-vue-app'), { config });
    });
</script>
</body>
</html>
